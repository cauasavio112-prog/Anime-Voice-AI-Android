
name: Build Anime Voice AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -o AnimeVoiceAI_Android_GitHub_Build.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeVoiceAI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
